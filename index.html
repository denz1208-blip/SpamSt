<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СЛЕЗА ПОДЗЕМЕЛЬЯ — The Underground Tear</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="560"></canvas>
  <div id="ui">
    <div id="menu" class="panel">
      <h1>СЛЕЗА ПОДЗЕМЕЛЬЯ</h1>
      <p class="sub">Рогалик в духе Binding of Isaac</p>
      <div class="pick">
        <div class="char selected" data-char="isaac"><div class="fd fd-isaac"></div><b>Плакса</b><span>Скорострел. Слёзы летят дальше.</span></div>
        <div class="char" data-char="magda"><div class="fd fd-magda"></div><b>Магда</b><span>Крепкая душа. Но бьёт слабее.</span></div>
        <div class="char" data-char="cain"><div class="fd fd-cain"></div><b>Каин</b><span>Меткий и быстрый. Удача решает.</span></div>
      </div>
      <button id="startBtn">СПУСТИТЬСЯ В ПОДЗЕМЕЛЬЕ</button>
      <p class="hint">WASD — движение · Стрелки — слёзы · E — подобрать/купить · Q — бомба · Esc — карта</p>
      <p class="hint" id="statsLine"></p>
    </div>
    <div id="death" class="panel hidden">
      <h1 id="deathTitle">ТЫ ПОГИБ</h1>
      <p id="deathStats"></p>
      <button id="restartBtn">ЕЩЁ РАЗ</button>
      <button id="menuBtn">В МЕНЮ</button>
    </div>
    <div id="win" class="panel hidden">
      <h1>ПОБЕДА!</h1>
      <p id="winStats"></p>
      <button id="againBtn">НОВЫЙ ЗАБЕГ</button>
    </div>
  </div>
</div>
<!-- Автообновление через GitHub: updater.js + загрузка исходников (из кэша обновлений или с диска) -->
<script src="js/updater.js"></script>
<script>window.__updaterPreload();</script>
<script>
(function(){
  // __updaterPreload уже подменил файлы из кэша через document.write;
  // догружаем только те, которых нет в кэше
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem('isaac_updater_cache_v1')||'{}'); } catch(e){}
  ['js/items.js','js/entities.js','js/rooms.js','js/game.js'].forEach(function(f){
    if (!cache[f]) document.write('<script src="'+f+'"><\/script>');
  });
})();
</script>
</body>
</html>
